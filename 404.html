<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d12">
<title>Luca Grella · 404</title>
<link rel="icon" type="image/x-icon" href="/assets/img/icon/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* 404 for luca-grella.github.io in the dark glass style (dark orange): glass cards over a blurred dusk scene,
   one orange accent, muted category tints, a count-up "404", a flat-lining chart and staged entrance. */
:root{
  color-scheme:dark;
  --accent:#f2894b; --accent-ink:#1d0f06;
  --bg:#0b0d12; --scene-a:#1a2130; --scene-b:#3b2a20; --scene-c:#202a38; --scene-fog:rgba(190,200,215,.06);
  --glass:rgba(20,23,31,.58); --glass-2:rgba(28,32,42,.66); --glass-hi:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --fg:#f2efea; --fg-2:rgba(236,231,224,.64); --fg-3:rgba(236,231,224,.4);
  --teal:#5db3a5; --ochre:#c8a262; --dust:#7f9dc6; --plum:#a98bc9; --down:#ff6b5e;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.9,.25,1.15);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

.scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--scene-a)}
.scene::before{content:"";position:absolute;inset:-20%;filter:blur(60px);
  background:
    radial-gradient(40% 30% at 22% 78%, var(--scene-b) 0%, transparent 70%),
    radial-gradient(35% 28% at 78% 18%, var(--scene-c) 0%, transparent 70%),
    radial-gradient(30% 45% at 60% 70%, color-mix(in srgb,var(--accent) 22%, transparent) 0%, transparent 70%),
    linear-gradient(180deg, var(--scene-a), var(--bg));}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--scene-fog),transparent 40%,var(--scene-fog))}
.notch{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}

.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi)}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font-weight:700;font-size:16px;flex-shrink:0;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-3);min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--fg);font-weight:600}
.sp{flex:1}
.btn{height:36px;padding:0 14px;border-radius:11px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent);font-size:13.5px}
.btn:focus-visible,.card:focus-visible,.suggest:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hero row */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.lost{padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-height:300px}
.chip{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:11.5px;padding:5px 10px;border-radius:20px;
  border:1px solid var(--line-2);color:var(--fg-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--down);box-shadow:0 0 0 0 color-mix(in srgb,var(--down) 60%,transparent);animation:ping 1.8s ease-out infinite}
@keyframes ping{to{box-shadow:0 0 0 8px transparent}}
.big{font-size:clamp(76px,13vw,128px);font-weight:700;letter-spacing:-4px;line-height:.9;margin:4px 0 0;
  background:linear-gradient(180deg,var(--fg) 30%,color-mix(in srgb,var(--accent) 70%,var(--fg)));-webkit-background-clip:text;background-clip:text;color:transparent}
.lost h1{margin:0;font-size:26px;line-height:1.15;letter-spacing:-.6px;font-weight:600;text-wrap:balance}
.lost p{margin:0;color:var(--fg-2);max-width:52ch}
.path{font-family:var(--mono);font-size:12.5px;color:var(--fg);background:var(--glass-2);border:1px solid var(--line);padding:2px 8px;border-radius:8px;word-break:break-all}
.suggest{display:flex;align-items:center;gap:12px;margin-top:auto;padding:12px 14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
  background:color-mix(in srgb,var(--accent) 12%,var(--glass-2));transition:transform .25s var(--ease)}
.suggest:hover{transform:translateY(-2px)}
.suggest small{display:block;font-size:11px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.08em}
.suggest b{font-size:15px}
.suggest .go{margin-left:auto;width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}

/* signal chart */
.signal{padding:18px 18px 14px;display:flex;flex-direction:column;gap:6px;min-height:300px}
.signal .hd{display:flex;align-items:flex-start;gap:8px}
.signal .hd small{display:block;font-size:12px;color:var(--fg-3)}
.signal .hd b{font-size:15px;font-weight:600}
.live{margin-left:auto;font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,107,94,.14);color:var(--down);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.signal .val{font-size:30px;font-weight:600;letter-spacing:-.8px}
.signal svg{width:100%;flex:1;min-height:150px;display:block;overflow:visible}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-3)}

/* destinations */
.label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);padding:4px 6px 0}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{--tint:var(--teal);position:relative;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:150px;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--tint) 22%,transparent),transparent 60%),var(--glass);
  transition:transform .3s var(--ease),border-color .3s}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--tint) 45%,transparent)}
.card .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--tint) 22%,transparent);color:var(--tint)}
.card b{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.card b i{width:7px;height:7px;border-radius:50%;background:var(--tint);display:inline-block}
.card p{margin:0;font-size:12.5px;color:var(--fg-2)}
.card .arrow{position:absolute;right:14px;top:14px;color:var(--fg-3);transition:transform .3s var(--ease),color .3s}
.card:hover .arrow{transform:translate(2px,-2px);color:var(--tint)}
.card .meta{margin-top:auto;font-size:11px;color:var(--fg-3);font-family:var(--mono)}
.foot{text-align:center;font-size:11.5px;color:var(--fg-3);padding-top:4px}

/* staged entrance: scene, then empty glass, then content */
.stage{opacity:0;transform:scale(.96)}
.stage>*{opacity:0;transition:opacity .4s ease}
body.s1 .stage{opacity:1;transform:none;transition:opacity .45s ease,transform .55s var(--ease);transition-delay:calc(var(--i)*60ms)}
body.s2 .stage>*{opacity:1;transition-delay:calc(var(--i)*60ms)}

@media (max-width:767px){
  .hero{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr;gap:12px}
  .card{min-height:0}
  .lost{min-height:0;padding:20px}
  .signal{min-height:240px}
  .crumbs span.host{display:none}
  .card{padding:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .stage,.stage>*{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"></div>
<div class="notch" aria-hidden="true"></div>

<div class="wrap">
  <header class="top glass stage" style="--i:0">
    <div class="logo">L</div>
    <div class="crumbs"><span class="host">luca-grella.github.io</span><span class="host">›</span><b data-t="crumb">Pagina non trovata</b></div>
    <div class="sp"></div>
    <a class="btn" href="/"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span data-t="home">Home</span></a>
  </header>

  <section class="hero">
    <div class="lost glass stage" style="--i:1">
      <span class="chip"><span class="dot"></span><span data-t="chip">Errore 404</span></span>
      <div class="big num" id="big" aria-label="404">404</div>
      <h1 data-t="title">Questa pagina non c'è più</h1>
      <p><span data-t="sub1">Il link</span> <span class="path" id="path">/</span> <span data-t="sub2">non porta da nessuna parte: forse è stato spostato o spento.</span></p>
      <a class="suggest" id="suggest" hidden>
        <div><small data-t="maybe">Forse cercavi</small><b id="sugName"></b></div>
        <span class="go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </div>

    <div class="signal glass stage" style="--i:2" aria-hidden="true">
      <div class="hd"><div><small data-t="sigSmall">Visite a questo link</small><b data-t="sigTitle">Segnale perso</b></div><span class="live"><span class="dot"></span>live</span></div>
      <div class="val num" id="val">0</div>
      <svg viewBox="0 0 300 140" preserveAspectRatio="none">
        <defs>
          <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2894b" stop-opacity=".35"/><stop offset="1" stop-color="#f2894b" stop-opacity="0"/></linearGradient>
        </defs>
        <g stroke="rgba(255,255,255,.07)" stroke-width="1" vector-effect="non-scaling-stroke"><line x1="0" y1="35" x2="300" y2="35"/><line x1="0" y1="70" x2="300" y2="70"/><line x1="0" y1="105" x2="300" y2="105"/></g>
        <path id="area" fill="url(#fill)" opacity="0"/>
        <path id="line" fill="none" stroke="#f2894b" stroke-width="2.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="axis"><span data-t="ago">−30 giorni</span><span data-t="now">ora</span></div>
    </div>
  </section>

  <div class="label stage" style="--i:3"><span data-t="where">Dove vuoi andare</span></div>
  <nav class="cards" id="cards"></nav>

  <div class="foot stage" style="--i:9"><span>© <span id="yr"></span> Luca Grella</span></div>
</div>

<script>
const IT = !/^en\b/i.test(navigator.language || 'it') ? true : false;
const T = {
  crumb:['Pagina non trovata','Page not found'], home:['Home','Home'], chip:['Errore 404','Error 404'],
  title:["Questa pagina non c'è più","This page isn't here anymore"], sub1:['Il link','The link'],
  sub2:['non porta da nessuna parte: forse è stato spostato o spento.',"doesn't lead anywhere: it may have moved or been switched off."],
  maybe:['Forse cercavi','Did you mean'], sigSmall:['Visite a questo link','Visits to this link'], sigTitle:['Segnale perso','Signal lost'],
  ago:['−30 giorni','−30 days'], now:['ora','now'], where:['Dove vuoi andare','Where to next']
};
const L = IT ? 0 : 1;
if (!IT) document.documentElement.lang = 'en';
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T[el.dataset.t][L]; });
document.getElementById('yr').textContent = new Date().getFullYear();

const ICON = {
  fish:'<path d="M3 12c3-5 9-6 14-2l4-3v10l-4-3c-5 4-11 3-14-2z"/><circle cx="14" cy="11" r=".8" fill="currentColor"/>',
  padel:'<ellipse cx="10" cy="9" rx="6" ry="7"/><path d="M14 14l6 7"/><circle cx="19" cy="5" r="1.6"/>',
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  pad:'<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3"/><circle cx="16" cy="11.5" r=".9" fill="currentColor"/><circle cx="18" cy="13.8" r=".9" fill="currentColor"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/>'
};
// Cards shown, in Luca's order: Home, Contacts, Giochi.
const DEST = [
  {key:'home', href:'/', name:'Home', tint:'var(--dust)', icon:'home',
   desc:['Il portfolio di Luca Grella',"Luca Grella's portfolio"], meta:'/'},
  {key:'contacts', href:'/contacts/', name:'Contacts', tint:'var(--plum)', icon:'mail',
   desc:['Tutti i profili in un posto','All profiles in one place'], meta:'/contacts'},
  {key:'giochi', href:'/giochi/', name:'Giochi', tint:'var(--teal)', icon:'pad',
   desc:['Tutti i giochi, da giocare nel browser','All the games, playable in the browser'], meta:'/giochi'}
];
// Possible "Did you mean" targets: the cards above plus each game.
const TARGETS = [
  {key:'lenza-lenta', alias:['pesca','fishing'], href:'/lenza-lenta/', name:'Lenza Lenta'},
  {key:'terrazza-padel', alias:['padel','tennis'], href:'/terrazza-padel/', name:'Terrazza Padel'},
  {key:'contacts', alias:['contatti','links','link'], href:'/contacts/', name:'Contacts'},
  {key:'giochi', alias:['games','game','gioco','giochi'], href:'/giochi/', name:'Giochi'}
];
const svg = d => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
document.getElementById('cards').innerHTML = DEST.map((d,i) => `
  <a class="card glass stage" style="--i:${4+i};--tint:${d.tint}" href="${d.href}">
    <span class="ic">${svg(ICON[d.icon])}</span>
    <span class="arrow">${svg('<path d="M7 17L17 7M8 7h9v9"/>')}</span>
    <b><i></i>${d.name}</b>
    <p>${d.desc[L]}</p>
    <span class="meta">${d.meta}</span>
  </a>`).join('');

// The path that was asked for. ?path= lets anyone preview the page with a made-up link.
const asked = new URLSearchParams(location.search).get('path') || location.pathname;
document.getElementById('path').textContent = asked;

// Suggest the closest destination by edit distance on the first path segment.
function dist(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
const seg = (asked.split('/').filter(Boolean)[0] || '').toLowerCase().replace(/\.html?$/,'');
if (seg) {
  let best=null, bd=1e9;
  for (const d of TARGETS) {
    // Full-name distance, or (for 4+ letters) distance to the start of the name, so "terraza" finds Terrazza Padel.
    const k = d.key, s = seg.startsWith(k) ? 0 : Math.min(dist(seg,k), seg.length >= 4 ? dist(seg,k.slice(0,seg.length)) : 1e9);
    const a = (d.alias||[]).includes(seg) ? 0 : 1e9;
    if (Math.min(s,a) < bd) { bd = Math.min(s,a); best = d; }
  }
  if (best && bd <= Math.max(2, Math.floor(best.key.length/3))) {
    const a = document.getElementById('suggest');
    a.href = best.href; a.hidden = false; document.getElementById('sugName').textContent = best.name;
  }
}

// Flat-lining chart: some visits, then the link dies and the line drops to zero.
const pts = [62,70,58,74,66,80,72,86,78,90,84,76,88,70,40,8,0,0,0,0];
const W=300,H=140,pad=8, X=i=>i*(W/(pts.length-1)), Y=v=>H-pad-(v/100)*(H-2*pad);
function smooth(p){let d=`M${X(0)},${Y(p[0])}`;for(let i=0;i<p.length-1;i++){const p0=p[i-1]??p[i],p1=p[i],p2=p[i+1],p3=p[i+2]??p2;
  const c1x=X(i)+(X(i+1)-X(i-1>=0?i-1:i))/6,c1y=Y(p1)+(Y(p2)-Y(p0))/6,c2x=X(i+1)-(X(i+2<p.length?i+2:i+1)-X(i))/6,c2y=Y(p2)-(Y(p3)-Y(p1))/6;
  d+=` C${c1x},${c1y} ${c2x},${c2y} ${X(i+1)},${Y(p2)}`}return d}
const line=document.getElementById('line'), area=document.getElementById('area');
line.setAttribute('d', smooth(pts)); area.setAttribute('d', smooth(pts)+` L${W},${H} L0,${H} Z`);

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el,to,ms){ if(reduce){el.textContent=to;return} const t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/ms), e=1-Math.pow(1-k,3); el.textContent=Math.round(to*e); if(k<1) requestAnimationFrame(f)})(t0) }
function drawLine(){ const len=line.getTotalLength(); if(reduce){area.setAttribute('opacity',1);return}
  line.style.strokeDasharray=len; line.style.strokeDashoffset=len; line.getBoundingClientRect();
  line.style.transition='stroke-dashoffset 1.4s cubic-bezier(.3,.8,.2,1)'; line.style.strokeDashoffset=0;
  area.style.transition='opacity .8s ease .9s'; area.setAttribute('opacity',1); }

// Staged entrance: scene alone, then empty glass shapes, then content.
  setTimeout(()=>document.body.classList.add('s1'), reduce?0:120);
setTimeout(()=>{ document.body.classList.add('s2'); countUp(document.getElementById('big'),404,900); drawLine(); }, reduce?0:620);
</script>
</body>
</html>
