<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23233a"/>
      <stop offset="48%" stop-color="#0c0c16"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="50%" cy="-10%" r="90%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#9be8ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#64d2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#30d158"/>
      <stop offset="55%" stop-color="#64d2ff"/>
      <stop offset="100%" stop-color="#0a84ff"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#30d158" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#0a84ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- sfondo squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glowTop)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <!-- griglia orizzontale sottilissima -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <line x1="84" y1="180" x2="428" y2="180"/>
    <line x1="84" y1="264" x2="428" y2="264"/>
    <line x1="84" y1="348" x2="428" y2="348"/>
  </g>

  <!-- area sotto la curva -->
  <path d="M86 378 C 150 378, 162 306, 216 302 C 270 298, 264 224, 318 202 C 366 182, 390 154, 420 122 L 420 378 Z"
        fill="url(#area)"/>

  <!-- alone della curva -->
  <path d="M86 378 C 150 378, 162 306, 216 302 C 270 298, 264 224, 318 202 C 366 182, 390 154, 420 122"
        fill="none" stroke="url(#line)" stroke-width="34" stroke-linecap="round" filter="url(#soft)" opacity="0.5"/>

  <!-- curva principale -->
  <path d="M86 378 C 150 378, 162 306, 216 302 C 270 298, 264 224, 318 202 C 366 182, 390 154, 420 122"
        fill="none" stroke="url(#line)" stroke-width="23" stroke-linecap="round"/>

  <!-- punto finale luminoso -->
  <circle cx="420" cy="122" r="46" fill="url(#glowDot)"/>
  <circle cx="420" cy="122" r="16" fill="#ffffff"/>
</svg>
