<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wanderlust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "DM Sans", sans-serif;
  background: #FAFAF8;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 32px;
  padding: 40px 20px;
}
.logo { font-family: "Playfair Display", serif; font-size: 42px; font-style: italic; color: #E8A87C; letter-spacing: -1px; }
.sub { color: #6B6B6B; font-size: 15px; font-weight: 300; max-width: 260px; line-height: 1.6; text-align: center; }
.card {
  background: white; border: 1px solid #E5E5E0;
  border-radius: 16px; padding: 32px 28px;
  width: 100%; max-width: 340px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.06);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 14px 24px;
  background: #E8A87C; color: white;
  border: none; border-radius: 10px;
  font-family: "DM Sans", sans-serif; font-size: 16px; font-weight: 500;
  cursor: pointer;
}
.status { font-size: 13px; color: #9B9B9B; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<div class="logo">wanderlust</div>
<div class="sub">Tutti i tuoi viaggi, in un posto solo.</div>
<div class="card">
  <button class="btn" onclick="doLogin()">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#fff" d="M9 3.48c1.69 0 2.83.73 3.48 1.34l2.54-2.48C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l2.91 2.26C4.6 5.05 6.62 3.48 9 3.48z"/><path fill="#fff" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#fff" d="M3.88 10.78A5.54 5.54 0 0 1 3.58 9c0-.62.11-1.22.29-1.78L.96 4.96A9.008 9.008 0 0 0 0 9c0 1.45.35 2.82.96 4.04l2.92-2.26z"/><path fill="#fff" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.4-1.57-5.12-3.74L.95 13.04C2.44 15.98 5.48 18 9 18z"/></svg>
    Accedi con Google
  </button>
  <div class="status" id="status"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCu9NITVvHDuAkrF2yeO1ySsgVdE7dtsig",
  authDomain: "luca-grella-project.firebaseapp.com",
  projectId: "luca-grella-project",
  storageBucket: "luca-grella-project.firebasestorage.app",
  messagingSenderId: "961773544221",
  appId: "1:961773544221:web:5478ac6066fe3bcc1177f4"
});

const auth = getAuth(app);
const provider = new GoogleAuthProvider();

onAuthStateChanged(auth, async user => {
  if (user) {
    document.getElementById('status').textContent = '✓ Reindirizzamento...';
    window.location.href = './';
  }
});

window.doLogin = async function() {
  document.getElementById('status').textContent = 'Connessione...';
  try {
    await signInWithPopup(auth, provider);
  } catch(e) {
    document.getElementById('status').textContent = 'Errore: ' + e.message;
  }
};
</script>
</body>
</html>
