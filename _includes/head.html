  <script>
function myFunction() {
  if (window.innerWidth > 927 && window.innerHeight < 435) {
    return '';
  } else if (window.innerWidth > 927 && window.innerHeight < 465) {

  } else if (window.innerWidth > 927 && window.innerHeight < 495) {
    return '<p align="center"><img src="{{site.logo | relative_url}}" alt="Logo" style="width:20%"/>';
  } else if (window.innerWidth > 927 && window.innerHeight < 525) {

    return '<p align="center"><img src="{{site.logo | relative_url}}" alt="Logo" style="width:50%"/>';
  } else if (window.innerWidth < 927 && window.innerWidth > 767 && window.innerHeight < 262) {
    return '';

  } else if (window.innerWidth < 927 && window.innerWidth > 767 && window.innerHeight < 295) {
    return '<p align="center"><img src="{{site.logo | relative_url}}" alt="Logo" style="width:20%"/>';
  } else if (window.innerWidth < 927 && window.innerWidth > 767 && window.innerHeight < 315) {
    return '<p align="center"><img src="{{site.logo | relative_url}}" alt="Logo" style="width:30%"/>';
  } else if (window.innerWidth < 927 && window.innerWidth > 767 && window.innerHeight < 330) {
    return '<p align="center"><img src="{{site.logo | relative_url}}" alt="Logo" style="width:40%"/>';
  } else if (window.innerWidth < 927 && window.innerWidth > 767 && window.innerHeight < 350) {
    return '<p align="center"><img src="{{site.logo | relative_url}}" alt="Logo" style="width:50%"/>';
  } else if (window.innerWidth < 767) {
    return '<p align="center"><img src="{{site.logo | relative_url}}" alt="Logo" style="width:25%"/>';
  } else {
    return '<p align="center"><img src="{{site.logo | relative_url}}" alt="Logo" style="width:60%"/>';
  }
}
</script>
