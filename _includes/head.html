<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202020">
  <link href="https://gmpg.org/xfn/11" rel="profile">

  <title>
    {% if page.title == "Home" or page.home -%}
      {{ site.title }} &middot; {{ site.tagline }}
    {%- else -%}
      {{ site.title }} &middot; {{ page.title }}
    {%- endif %}
  </title>

  <!-- SEO -->
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author.name }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ site.title }} &middot; {{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/logo.png' | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@{{ site.author.twitter }}">
  <meta name="twitter:creator" content="@{{ site.author.twitter }}">
  <meta name="twitter:image" content="{{ '/assets/img/logo.png' | absolute_url }}">

  <!-- Performance hints -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ '/public/css/poole.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/public/css/syntax.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/public/css/hyde.css' | relative_url }}">

  <!-- Font Awesome 6 (with Subresource Integrity), loaded asynchronously to avoid render-blocking -->
  <link rel="preload"
        as="style"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">
  </noscript>

  <!-- Icons -->
  <link rel="icon" type="image/x-icon" href="{{ '/assets/img/icon/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ '/assets/img/icon/apple-touch-icon-144-precomposed.png' | relative_url }}">

  <!-- PWA -->
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }} feed" href="{{ '/atom.xml' | relative_url }}">

  <!-- Structured data (schema.org JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.author.name }}",
    "url": "{{ site.url }}",
    "image": "{{ '/assets/img/logo.png' | absolute_url }}",
    "jobTitle": "Senior Data Engineer & Functional Lead",
    "worksFor": {
      "@type": "Organization",
      "name": "lastminute.com",
      "url": "https://www.lastminute.com",
      "location": { "@type": "Place", "address": { "@type": "PostalAddress", "addressLocality": "Chiasso", "addressCountry": "CH" } }
    },
    "knowsLanguage": ["it", "en", "es"],
    "alumniOf": { "@type": "CollegeOrUniversity", "name": "Politecnico di Milano", "url": "https://www.polimi.it" },
    "sameAs": [
      "{{ site.linkedin }}",
      "{{ site.githublink }}",
      "{{ site.twitter }}",
      "{{ site.instagram }}",
      "{{ site.facebook }}",
      "{{ site.google_scholar }}",
      "{{ site.spotify }}",
      "{{ site.soundcloud }}"
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}",
    "description": "{{ site.description }}",
    "author": { "@type": "Person", "name": "{{ site.author.name }}" },
    "inLanguage": "{{ site.lang | default: 'en' }}"
  }
  </script>

  <!-- Theme toggle (light/dark), inline-ish so it runs before paint -->
  <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}"></script>

  <!-- Mobile: open social links in native apps when installed -->
  <script src="{{ '/assets/js/social-app-links.js' | relative_url }}" defer></script>
</head>
