{% unless page.no_sidebar %}
  <aside class="sidebar">
    <div class="container">
      <div class="sidebar-about">
        <h1 class="sidebar-title">{{ site.title }}</h1>

        <picture>
          <source type="image/webp" srcset="{{ '/assets/img/logo.webp' | relative_url }}">
          <img src="{{ site.logo | relative_url }}" alt="Luca Grella" class="sidebar-logo" width="200" height="200">
        </picture>

        <div class="social-icons">
          <a href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" class="social-icon linkedin"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i></a>
          <a href="{{ site.instagram }}" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="social-icon instagram"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a>
          <a href="{{ site.twitter }}" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)" class="social-icon x-twitter"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i></a>
          <a href="{{ site.facebook }}" target="_blank" rel="noopener noreferrer" aria-label="Facebook" class="social-icon facebook"><i class="fa-brands fa-facebook-f" aria-hidden="true"></i></a>
          <a href="{{ site.githublink }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub" class="social-icon github"><i class="fa-brands fa-github" aria-hidden="true"></i></a>
          <a href="{{ site.google_scholar }}" target="_blank" rel="noopener noreferrer" aria-label="Google Scholar" class="social-icon gscholar"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i></a>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Main navigation">
        <a class="sidebar-nav-item{% if page.home %} active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
        <a class="sidebar-nav-item{% if page.myportfolio %} active{% endif %}" href="{{ '/myportfolio' | relative_url }}">My Portfolio</a>
        <a class="sidebar-nav-item{% if page.aboutme %} active{% endif %}" href="{{ '/aboutme' | relative_url }}">About Me</a>
        <a class="sidebar-nav-item{% if page.sports %} active{% endif %}" href="{{ '/sports' | relative_url }}">Sports &amp; Interests</a>
        <a class="sidebar-nav-item{% if page.projects %} active{% endif %}" href="{{ '/projects' | relative_url }}">My Projects</a>
        <a class="sidebar-nav-item{% if page.certifications %} active{% endif %}" href="{{ '/certifications' | relative_url }}">Licenses &amp; Certifications</a>
        <a class="sidebar-nav-item{% if page.djteck %} active{% endif %}" href="{{ '/djteck' | relative_url }}">DJing &amp; Producing</a>
      </nav>

      <div class="sidebar-footer">
        <p>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}. All rights reserved.</p>
      </div>
    </div>
  </aside>
{% endunless %}
