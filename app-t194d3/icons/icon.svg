<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2236"/><stop offset=".55" stop-color="#131624"/><stop offset="1" stop-color="#0a0b12"/>
    </linearGradient>
    <radialGradient id="glowO" cx="50%" cy="56%" r="45%">
      <stop offset="0" stop-color="#f2894b" stop-opacity=".55"/><stop offset=".5" stop-color="#f2894b" stop-opacity=".14"/><stop offset="1" stop-color="#f2894b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="80%" cy="12%" r="55%">
      <stop offset="0" stop-color="#a98bc9" stop-opacity=".45"/><stop offset="1" stop-color="#a98bc9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="75%">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
    <radialGradient id="dial" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset=".7" stop-color="#ffffff" stop-opacity=".06"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".6"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".1"/><stop offset="1" stop-color="#ffffff" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd0a6"/><stop offset=".45" stop-color="#f2894b"/><stop offset="1" stop-color="#b9501b"/>
    </linearGradient>
    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="26"/><feOffset dy="30"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="key" d="M512 392 a78 78 0 0 1 44 142 l26 134 h-140 l26 -134 a78 78 0 0 1 44 -142 z"/>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glowP)"/>
  <rect width="1024" height="1024" fill="url(#glowO)"/>

  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="300" fill="#141724" fill-opacity=".72"/>
    <circle cx="512" cy="512" r="300" fill="url(#dial)"/>
  </g>
  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <circle cx="512" cy="512" r="236" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="3"/>

  <g stroke="#f2efea" stroke-linecap="round">
    <g stroke-opacity=".55" stroke-width="8">
      <line x1="512" y1="232" x2="512" y2="262"/><line x1="512" y1="762" x2="512" y2="792"/>
      <line x1="232" y1="512" x2="262" y2="512"/><line x1="762" y1="512" x2="792" y2="512"/>
    </g>
    <g stroke-opacity=".25" stroke-width="5" transform="rotate(30 512 512)">
      <line x1="512" y1="236" x2="512" y2="254"/><line x1="512" y1="770" x2="512" y2="788"/>
      <line x1="236" y1="512" x2="254" y2="512"/><line x1="770" y1="512" x2="788" y2="512"/>
    </g>
    <g stroke-opacity=".25" stroke-width="5" transform="rotate(60 512 512)">
      <line x1="512" y1="236" x2="512" y2="254"/><line x1="512" y1="770" x2="512" y2="788"/>
      <line x1="236" y1="512" x2="254" y2="512"/><line x1="770" y1="512" x2="788" y2="512"/>
    </g>
  </g>
  <circle cx="512" cy="232" r="10" fill="#f2894b"/>

  <use href="#key" fill="#f2894b" opacity=".8" filter="url(#blur30)" transform="translate(0 -18)"/>
  <use href="#key" fill="url(#orange)" transform="translate(0 -18)"/>
  <use href="#key" fill="none" stroke="#ffe0c6" stroke-opacity=".6" stroke-width="4" transform="translate(0 -18)"/>
  <ellipse cx="496" cy="420" rx="22" ry="12" fill="#ffffff" opacity=".45" filter="url(#blur10)"/>

  <path d="M220 210 l9 30 l30 9 l-30 9 l-9 30 l-9 -30 l-30 -9 l30 -9 z" fill="#efe2ff" opacity=".7"/>
  <rect width="1024" height="1024" fill="url(#vig)"/>
</svg>
