<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>

  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <title>
    {% if page.title == "Home" %}
      {{ site.title }} &middot; Welcome! <!--{{ site.tagline }}-->
    {% else %}
      {{ site.title }} &middot; {{ page.title }}
    {% endif %}
  </title>

      <!-- Icons -->
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="/assets/img/icon/apple-touch-icon-144-precomposed.png">
                                 <link rel="shortcut icon" href="/assets/img/icon/favicon.ico">
                                 

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->

 <div class="sidebar">

        {% if site.logo %}
          <p align="center"><img src="{{site.logo | relative_url}}" alt="Logo" style="width:75%"/></p>

        <p align="center">{{ site.description | default: site.github.project_tagline }}</p>

</div>
        <nav class="sidebar-nav"><p align="center">
          <a class="sidebar-nav-item{% if page.aboutme %} active{% endif %}" href="/">About Me</a>
          <a class="sidebar-nav-item{% if page.anotherpage %} active{% endif %}" href="/another-page.html">Another Page</a>
        </p></nav>
