<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2638"/><stop offset=".55" stop-color="#121722"/><stop offset="1" stop-color="#0a0c11"/>
    </linearGradient>
