<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Luca Grella | Tesi</title>
	<style>
	html { margin:0; padding:0; font-size:62.5%; }
	body { max-width:800px; min-width:300px; margin:0 auto; padding:20px 10px; font-size:14px; font-size:1.4em; }
	h1 { font-size:1.8em; }
	.demo { overflow:auto; border:1px solid silver; min-height:100px; }
	</style>
	<link rel="stylesheet" href="./../dist/themes/default/style.min.css" />
</head>
<body>

	<h1>CDT Infortuni</h1>
  <button id="openallnodes">Open All</button>
  <button id="closeallnodes">Close All</button>
  <button id="createroot">Create Root</button>
  <button id="createdimension">Create Dimension</button>
  <button id="createconcept">Create Concept</button>
  <button id="createattribute">Create Attribute</button>
  <button id="renamenode">Rename Node</button>
  <button id="deletenode">Delete Node</button>
  <br>
	<div id="jstree_demo" class="demo"></div><br>
  <div class="col-md-2 col-sm-4 col-xs-4" style="text-align:right;">
    <input type="text" value="" style="box-shadow:inset 0 0 4px #eee; width:120px; margin:0; padding:6px 12px; border-radius:4px; border:1px solid silver; font-size:1.1em;" id="demo_q" placeholder="Search" />
  </div><br>
  <button id="savejson">Save JSON</button><br><br>
  <em>INAIL-RECKON Project<br>Curated by Luca Grella</em>

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
	<script src="./../dist/jstree.min.js"></script>
	
	<script>

/////FUNZIONE SEARCH//////////////////////////////
    $(function () {
              var to = false;
              $('#demo_q').keyup(function () {
                if(to) { clearTimeout(to); }
                to = setTimeout(function () {
                  var v = $('#demo_q').val();
                  $('#jstree_demo').jstree(true).search(v);
                }, 250);
              });
////////////////////////////////////////////////
	
	// POPOLAZIONE DEL CDT
	$('#jstree_demo').jstree({
  "core" : {
    "animation" : 0,
    "check_callback" : true,
    "themes" : { "stripes" : true },
    'data' : {
				"url" : "./root.json",
				"dataType" : "json" 
			}
  },
  "types" : {
    "#" : {
      "max_children" : 512,
      "max_depth" : 512,
      "valid_children" : ["root"]
    },
    "root" : {
      "icon" : "./icons/root.png",
      "valid_children" : ["dimension"]
    },
    "dimension" : {
      "icon" : "./icons/dimension.png",
      "valid_children" : ["concept","attribute"]
    },
    "concept" : {
      "icon" : "./icons/concept.png",
      "valid_children" : ["dimension","attribute"]
    },
    "attribute" : {
      "icon" : "./icons/attribute.png",
      "valid_children" : []
    }
  },
  "plugins" : [
    /*"contextmenu", */"dnd", "search",
    "state", "types", "wholerow"
  ]
});

  //FINE FUNZIONE SEARCH////
  });
  //////////////////////////

//GENERAZIONE FILE JSON + DOWNLOAD IN LOCALE
function encode( s ) {
    var out = [];
    for ( var i = 0; i < s.length; i++ ) {
        out[i] = s.charCodeAt(i);
    }
    return new Uint8Array( out );
}

var savejson = document.getElementById( 'savejson' );
savejson.addEventListener( 'click', function() {
    
	var v = $('#jstree_demo').jstree(true).get_json('#', {flat:false,no_state:true, no_data:false, no_type:true, no_icon:true, no_li_attr:true, no_a_attr:true})

    var data = encode( JSON.stringify(v, null, 4) );

    var blob = new Blob( [ data ], {
        type: 'application/octet-stream'
    });
    
    url = URL.createObjectURL( blob );
    var link = document.createElement( 'a' );
    link.setAttribute( 'href', url );
    link.setAttribute( 'download', 'root.json' );
    
    var event = document.createEvent( 'MouseEvents' );
    event.initMouseEvent( 'click', true, true, window, 1, 0, 0, 0, 0, false, false, false, false, 0, null);
    link.dispatchEvent( event );
});

//FUNZIONI PER BUTTONS: CREATION, RENAME, DELETE, OPEN E CLOSE ALL NODES
var createattribute = document.getElementById( 'createattribute' );
createattribute.addEventListener( 'click', function() {

              var ref = $('#jstree_demo').jstree(true),
                sel = ref.get_selected();
              if(!sel.length) { return false; }
              var i;
			  for (i = 0; i < sel.length; i++) { 
			  sela = sel[i];
        var v = $('#jstree_demo').jstree(true).get_json(sela);
        var data = encode( JSON.stringify(v, null, 4) );
        if (JSON.parse(data).children[0].type == "concept" || JSON.parse(data).children[0].type == "dimension") {
  //  block of code to be executed if the condition is true
} else {
  asd = ref.create_node(sela, {"type":"attribute"});
              if(asd) {
                ref.edit(asd);
              }
}
			  
			  }
            });

var createconcept = document.getElementById( 'createconcept' );
createconcept.addEventListener( 'click', function() {

              var ref = $('#jstree_demo').jstree(true),
                sel = ref.get_selected();
              if(!sel.length) { return false; }
              var i;
			  for (i = 0; i < sel.length; i++) { 
			  sela = sel[i];
			  asd = ref.create_node(sela, {"type":"concept"});
              if(asd) {
                ref.edit(asd);
              }
			  }
            });

var createdimension = document.getElementById( 'createdimension' );
createdimension.addEventListener( 'click', function() {

              var ref = $('#jstree_demo').jstree(true),
                sel = ref.get_selected();
              if(!sel.length) { return false; }
              var i;
			  for (i = 0; i < sel.length; i++) { 
			  sela = sel[i];
			  asd = ref.create_node(sela, {"type":"dimension"});
              if(asd) {
                ref.edit(asd);
              }
			  }
            });

var createroot = document.getElementById( 'createroot' );
createroot.addEventListener( 'click', function() {

              var ref = $('#jstree_demo').jstree(true),
              sel = ref.create_node("#", {"type":"root"});
              if(sel) {
                ref.edit(sel);
              }
            });

var renamenode = document.getElementById( 'renamenode' );
renamenode.addEventListener( 'click', function() {

              var ref = $('#jstree_demo').jstree(true),
                sel = ref.get_selected();
              if(!sel.length) { return false; }
              sel = sel[0];
              ref.edit(sel);
            });

var deletenode = document.getElementById( 'deletenode' );
deletenode.addEventListener( 'click', function() {

              var ref = $('#jstree_demo').jstree(true),
                sel = ref.get_selected();
              if(!sel.length) { return false; }
              ref.delete_node(sel);
            });

var openallnodes = document.getElementById( 'openallnodes' );
openallnodes.addEventListener( 'click', function() {

              $('#jstree_demo').jstree('open_all')
            });

var closeallnodes = document.getElementById( 'closeallnodes' );
closeallnodes.addEventListener( 'click', function() {

              $('#jstree_demo').jstree('close_all')
            });

	</script>
</body>
</html>
